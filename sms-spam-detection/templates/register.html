{% extends 'layout.html' %}

{% block content %}

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
  }

  body {
    background: linear-gradient(135deg, #4facfe, #00f2fe);
  }

  .register-container {
    width: 100%;
    min-height: 90vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .register-box {
    width: 400px;
    background: #fff;
    padding: 35px;
    border-radius: 15px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, .2);
  }

  .register-box h2 {
    text-align: center;
    margin-bottom: 25px;
    color: #333;
  }

  .input-group {
    margin-bottom: 18px;
  }

  .input-group label {
    display: block;
    margin-bottom: 6px;
    font-weight: bold;
    color: #444;
  }

  .input-group input {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 15px;
    outline: none;
    transition: .3s;
  }

  .input-group input:focus {
    border-color: #4facfe;
    box-shadow: 0 0 8px rgba(79, 172, 254, .3);
  }

  .register-btn {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: #4facfe;
    color: white;
    font-size: 16px;
    cursor: pointer;
    transition: .3s;
  }

  .register-btn:hover {
    background: #1b8ef2;
  }

  .bottom-text {
    margin-top: 18px;
    text-align: center;
    font-size: 14px;
  }

  .bottom-text a {
    color: #4facfe;
    text-decoration: none;
    font-weight: bold;
  }

  .bottom-text a:hover {
    text-decoration: underline;
  }
</style>

<div class="register-container">

  <div class="register-box">

    <h2>📝 Create Account</h2>

    <form method="POST">

      <div class="input-group">
        <label>Username</label>
        <input type="text" name="username" placeholder="Enter Username" required>
      </div>

      <div class="input-group">
        <label>Email</label>
        <input type="email" name="email" placeholder="Enter Email Address" required>
      </div>

      <div class="input-group">
        <label>Password</label>
        <input type="password" name="password" placeholder="Create Password" required>
      </div>

      <button type="submit" class="register-btn">
        Register
      </button>

    </form>

    <div class="bottom-text">
      Already have an account?
      <a href="{{ url_for('login') }}">Login</a>
    </div>

  </div>

</div>
{% endblock %}
