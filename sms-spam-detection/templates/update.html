{% extends 'layout.html' %}

{% block content %}

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
    }

    body {
        background: linear-gradient(135deg, #4facfe, #00f2fe);
    }

    .update-container {
        width: 100%;
        min-height: 90vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .update-box {
        width: 420px;
        background: #fff;
        padding: 35px;
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, .2);
    }

    .update-box h2 {
        text-align: center;
        margin-bottom: 25px;
        color: #333;
    }

    .input-group {
        margin-bottom: 18px;
    }

    .input-group label {
        display: block;
        margin-bottom: 6px;
        font-weight: bold;
        color: #444;
    }

    .input-group input {
        width: 100%;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 8px;
        outline: none;
        font-size: 15px;
        transition: .3s;
    }

    .input-group input:focus {
        border-color: #4facfe;
        box-shadow: 0 0 8px rgba(79, 172, 254, .3);
    }

    .update-btn {
        width: 100%;
        padding: 12px;
        background: #4facfe;
        color: #fff;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
        transition: .3s;
    }

    .update-btn:hover {
        background: #1b8ef2;
    }

    .bottom-text {
        text-align: center;
        margin-top: 18px;
        font-size: 14px;
    }

    .bottom-text a {
        text-decoration: none;
        color: #4facfe;
        font-weight: bold;
    }

    .bottom-text a:hover {
        text-decoration: underline;
    }

    @media(max-width:480px) {
        .update-box {
            width: 90%;
            padding: 25px;
        }
    }
</style>

<div class="update-container">

    <div class="update-box">

        <h2>✏️ Update Profile</h2>

        <form method="POST" action="{{ url_for('update', id=user.id) }}">

            <div class="input-group">
                <label>Username</label>
                <input type="text" name="username" value="{{ user.username }}" required>
            </div>

            <div class="input-group">
                <label>Email</label>
                <input type="email" name="email" value="{{ user.email }}" required>
            </div>

            <div class="input-group">
                <label>New Password</label>
                <input type="password" name="password" placeholder="Leave blank to keep current password">
            </div>

            <button type="submit" class="update-btn">
                Update Profile
            </button>

        </form>

        <div class="bottom-text">
            <a href="{{ url_for('home') }}">⬅ Back to Home</a>
        </div>

    </div>

</div>

{% endblock %}
